name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DynamiskaWebbapplikationerProjektArbete2021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: DynamiskaWebbapplikationerProjektArbete2021/package-lock.json
      - name: Installera beroenden
        run: npm ci
      - name: Kontrollera syntax i alla JavaScript-filer
        run: |
          for f in index.js crypt.js database/*.js routes/*.js; do
            node --check "$f"
          done
